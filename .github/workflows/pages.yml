name: Publish public support site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Test download recovery and artifact readiness
        run: |
          python3 tools/test_kvert_review.py
          python3 tools/test_mirror_site.py
          node tools/test_pages_artifact.cjs
      - name: Build validated public artifact
        run: python3 tools/mirror_site.py --local
      - name: Upload only validated public files
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
  deploy:
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
