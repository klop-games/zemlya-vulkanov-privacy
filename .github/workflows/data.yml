name: Данные приложения
# Раз в день: коды KVERT публикуются сами. Сторож сводок Минтуризма (tools/mintur_watch.py)
# здесь не работает: kamgov.ru отвечает серверам GitHub 403 (проверено 20.11.2026).
# Решение Никиты 20.11.2026: проверка на сервере GitHub вместо задачи Claude на Mac.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Коды KVERT
        run: python3 tools/kvert_server.py
      - name: Опубликовать, если изменилось
        run: |
          if ! git diff --quiet -- activity.json updates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Коды KVERT: прогноз от $(python3 -c 'import json;print(json.load(open("activity.json"))["forecastDate"])')" -- activity.json updates.json
            git push
          fi
      - name: Build validated public artifact
        run: python3 tools/mirror_site.py --local
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages in this workflow
        id: deployment
        uses: actions/deploy-pages@v4
