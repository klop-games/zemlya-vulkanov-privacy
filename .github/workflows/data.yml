name: Данные приложения
# KVERT updates and Pages deployment remain in the same workflow run.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Test download recovery and artifact readiness
        run: |
          python3 tools/test_mirror_site.py
          node tools/test_pages_artifact.cjs
      - name: Коды KVERT
        run: python3 tools/kvert_server.py
      - name: Опубликовать, если изменилось
        run: |
          if ! git diff --quiet -- activity.json updates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Коды KVERT: прогноз от $(python3 -c 'import json;print(json.load(open("activity.json"))["forecastDate"])')" -- activity.json updates.json
            git push
          fi
      - name: Build validated public artifact
        run: python3 tools/mirror_site.py --local
      - name: Upload only validated public files
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site
  deploy:
    needs: data
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      artifact_id: ${{ needs.data.outputs.artifact_id }}
